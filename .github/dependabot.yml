version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "ruff"
          - "pyright"
          - "bandit"
          - "pre-commit"
          - "pytest*"
          - "coverage*"
          - "mkdocs*"
      science-deps:
        applies-to: version-updates
        patterns:
          - "numpy"
          - "scipy"
          - "matplotlib"
          - "pandas"
          - "jupyter*"
          - "notebook*"
          - "ipython*"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
